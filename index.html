<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شاهان اسکن</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }
    h1 { color: #166534; }
    button, input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #166534;
      color: white;
      border: 0;
    }
    input { border: 1px solid #bbb; }
    #reader { margin-top: 20px; }
    #result {
      margin-top: 18px;
      overflow-wrap: anywhere;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>شاهان اسکن</h1>
    <p>اسکن بارکد محصولات</p>

    <button onclick="startScan()">شروع اسکن با دوربین</button>
    <div id="reader"></div>

    <input id="barcode" placeholder="یا بارکد را دستی وارد کنید">
    <button onclick="showCode()">بررسی بارکد</button>

    <div id="result"></div>
  </div>

  <script>
    let scanner = null;
    let scanned = false;

    async function startScan() {
      const result = document.getElementById("result");
      result.textContent = "در حال آماده‌سازی دوربین...";

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        scanned = false;

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 150 } },
          async function(decodedText) {
            if (scanned) return;
            scanned = true;

            document.getElementById("barcode").value = decodedText;
            result.textContent = "بارکد خوانده شد: " + decodedText;

            try {
              await scanner.stop();
            } catch (e) {}
          },
          function(error) {}
        );

        result.textContent = "دوربین فعال است؛ بارکد را مقابل دوربین بگیر.";
      } catch (error) {
        result.textContent =
          "دوربین فعال نشد. اجازه دسترسی دوربین را بررسی کن.";
      }
    }

    function showCode() {
      const code = document.getElementById("barcode").value.trim();
      document.getElementById("result").textContent =
        code ? "بارکد: " + code : "لطفاً بارکد را وارد کن.";
    }
  </script>
</body>
</html>
